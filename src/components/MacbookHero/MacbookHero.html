<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacbookHero - Premium SaaS Experience</title>
    <link rel="stylesheet" href="MacbookHero.css">
</head>
<body>

    <section class="macbook-hero-container">
        
        <!-- Hero Text (Background layer) -->
        <div class="hero-text">
            <h1 class="hero-title">Elevate Your Product</h1>
            <p class="hero-subtitle">Experience the future of SaaS interfaces.</p>
        </div>

        <div class="macbook-wrapper">
            <div class="macbook-container">
                
                <!-- The Lid (Screen) -->
                <div class="macbook-lid">
                    <div class="macbook-screen">
                        
                        <!-- Internal Screen Content -->
                        <div class="screen-content">
                            <div class="macbook-notch"></div>
                            <div class="screen-glare"></div>

                            <!-- Workspace Windows -->
                            
                            <!-- Window 1: Analytics -->
                            <div class="workspace-window window-analytics">
                                <div class="window-header">
                                    <div class="window-dot dot-red"></div>
                                    <div class="window-dot dot-yellow"></div>
                                    <div class="window-dot dot-green"></div>
                                </div>
                                <div class="window-content">
                                    <div class="metric-card">
                                        <span class="metric-label">Monthly Revenue</span>
                                        <span class="metric-value" data-value="128450">$0</span>
                                        <div class="chart-container">
                                            <div class="chart-bar bar-1" data-height="40%"></div>
                                            <div class="chart-bar bar-2" data-height="65%"></div>
                                            <div class="chart-bar bar-3" data-height="45%"></div>
                                            <div class="chart-bar bar-4" data-height="80%"></div>
                                            <div class="chart-bar bar-5" data-height="95%"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Window 2: Active Users -->
                            <div class="workspace-window window-users">
                                <div class="window-header">
                                    <div class="window-dot dot-red"></div>
                                    <div class="window-dot dot-yellow"></div>
                                    <div class="window-dot dot-green"></div>
                                </div>
                                <div class="window-content">
                                    <div class="metric-card">
                                        <span class="metric-label">Active Users</span>
                                        <span class="metric-value metric-users" data-value="1240">0</span>
                                        <p class="metric-trend">↑ 12% vs last hour</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Window 3: Terminal/Code (Glassy) -->
                            <div class="workspace-window window-terminal">
                                <div class="window-header">
                                    <div class="window-dot dot-red"></div>
                                    <div class="window-dot dot-yellow"></div>
                                    <div class="window-dot dot-green"></div>
                                </div>
                                <div class="window-content">
                                    <code class="terminal-code">
                                        > node deploy.js<br>
                                        [OK] Optimized...<br>
                                        [OK] CDN Push...
                                    </code>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- The Base -->
                <div class="macbook-base"></div>

            </div>
        </div>
    </section>

    <!-- Content for scroll demonstration -->
    <div class="scroll-hint-footer">
        <p>Scroll up to open the MacBook</p>
    </div>

    <script src="MacbookHero.js"></script>
</body>
</html>
