services:
  # ─── BACKEND (FastAPI) ───
  - type: web
    name: hub-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://hub-client-gpby.onrender.com

  # ─── FRONTEND (React + Vite) ───
  - type: web
    name: hub-frontend
    runtime: static
    static: true
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hub-api
          type: web
          property: url
