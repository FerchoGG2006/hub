services:
  # ─── BACKEND (FastAPI) ───
  - type: web
    name: hub-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: postgresql://platorin_user:vGCQkb6wkWzYmNGoHUg8NwaErT2TAkxs@dpg-d89b74ml51nc7388m26g-a/platorin
      - key: GEMINI_API_KEY
        value: AIzaSyAF4jl-4aMZK9pk5uOcRJ95PWOyQTz8JY8
      - key: JWT_SECRET
        value: 9e59f1ae-52d0-434d-848f-572c3a051503
      - key: FRONTEND_URL
        value: https://hub-frontend-bbaa.onrender.com
      - key: FB_CLIENT_ID
        value: 1975318246711677
      - key: FB_CLIENT_SECRET
        value: 2be64dd59233f0a37d88c7026bc6a142
      - key: META_VERIFY_TOKEN
        value: hub_secret_token_2026
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_ENV
        value: sandbox
      - key: REDIS_URL
        fromService:
          type: redis
          name: hub-redis
          property: connectionString

  # ─── FRONTEND (React + Vite served via Node) ───
  - type: web
    name: hub-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npx serve dist -s -l $PORT
    envVars:
      - key: VITE_API_URL
        value: https://hub-api-2lql.onrender.com
      - key: VITE_FB_APP_ID
        value: 1975318246711677

  # ─── INFRASTRUCTURE (Redis for Horizontal Scaling) ───
  - type: redis
    name: hub-redis
    ipAllowList: [] # Solo accesible internamente por la API
    plan: free
