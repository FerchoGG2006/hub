services:
  # ─── BACKEND (FastAPI) ───
  - type: web
    name: hub-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_oZXsypkIR20u@ep-snowy-salad-ama4nvfw-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: GOOGLE_API_KEY
        value: AIzaSyBUI4qYnHwRKxFrgbSR2yB86CPYaLLemqw
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://hub-client-gpby.onrender.com

  # ─── FRONTEND (React + Vite) ───
  - type: static_site
    name: hub-frontend
    env: static
    buildCommand: npm install && npm run build
    publishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hub-api
          type: web
          property: url
