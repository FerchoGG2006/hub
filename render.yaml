services:
  # ════════════════ BACKEND (FastAPI) ════════════════
  - type: web
    name: hub-api
    runtime: python
    rootContext: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        placeholder: "Pega aquí tu URL de Neon (postgresql://...)"
      - key: FRONTEND_URL
        value: "https://hub-client.onrender.com"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ════════════════ FRONTEND (React/Vite) ════════════════
  - type: static
    name: hub-client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hub-api
          type: web
          property: url
