services:
  # ════════════════ BACKEND (FastAPI - Web Service) ════════════════
  - type: web
    name: hub-api
    runtime: python
    rootContext: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_oZXsypkIR20u@ep-snowy-salad-ama4nvfw-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      - key: FRONTEND_URL
        value: "https://hub-client.onrender.com"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        value: "AIzaSyBUI4qYnHwRKxFrgbSR2yB86CPYaLLemqw"
      - key: PYTHON_VERSION
        value: 3.11.0

  # ════════════════ FRONTEND (React/Vite - Static Site) ════════════════
  - type: web
    name: hub-client
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hub-api
          type: web
          property: url
