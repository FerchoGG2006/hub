services:
  # ─── BACKEND (FastAPI) ───
  - type: web
    name: hub-api
    runtime: python
    buildCommand: pip install -r backend/requirements.lock
    healthCheckPath: /health/ready
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: AUTO_CREATE_SCHEMA
        value: 'false'
      - key: ENABLE_SCHEDULER
        value: 'true'
      - key: SEED_DEMO_DATA
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://hub-frontend-bbaa.onrender.com
      - key: FB_CLIENT_ID
        value: 1975318246711677
      - key: FB_CLIENT_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_ENV
        value: sandbox
      - key: REDIS_URL
        fromService:
          type: redis
          name: hub-redis
          property: connectionString

  # ─── FRONTEND (React + Vite served via Node) ───
  - type: web
    name: hub-frontend
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm exec -- serve dist -s -l $PORT
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_API_URL
        value: https://hub-api-2lql.onrender.com
      - key: VITE_FB_APP_ID
        value: 1975318246711677

  # ─── INFRASTRUCTURE (Redis for Horizontal Scaling) ───
  - type: redis
    name: hub-redis
    ipAllowList: [] # Solo accesible internamente por la API
    plan: free
