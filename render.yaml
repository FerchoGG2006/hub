services:
  # ─── BACKEND (FastAPI) ───
  - type: web
    name: hub-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Poner aquí tu URL de Neon DB o similar
      - key: GOOGLE_API_KEY
        sync: false # Tu llave de Gemini
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: hub-frontend
          type: static_site
          property: url

  # ─── FRONTEND (React + Vite) ───
  - type: static_site
    name: hub-frontend
    env: static
    buildCommand: npm install && npm run build
    publishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hub-api
          type: web
          property: url
